<!-- Контейнер для кнопки и виджета -->
<div class="tiktok-wrapper">
  
  <!-- Кнопка открытия -->
  <button id="load-tiktok-btn" onclick="loadTikTokWidget()">
    Открыть профиль TikTok
  </button>

  <!-- Индикатор загрузки (скрыт по умолчанию) -->
  <div id="tiktok-loader" class="loader" style="display: none;"></div>

  <!-- Контейнер для самого виджета (скрыт по умолчанию) -->
  <div id="tiktok-container" style="display: none;">
    <blockquote class="tiktok-embed" cite="https://tiktok.com" data-unique-id="scl.pp.ua" data-embed-type="creator" style="max-width: 780px; min-width: 288px;">
      <section>
        <a target="_blank" href="https://tiktok.com?refer=creator_embed">@scl.pp.ua</a>
      </section>
    </blockquote>
  </div>
</div>

<!-- Стили для кнопки, анимации загрузки и плавного появления -->
<style>
  .tiktok-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px 0;
  }
  
  /* Стили кнопки */
  #load-tiktok-btn {
    padding: 12px 24px;
    font-size: 16px;
    background-color: #fe2c55; /* Фирменный цвет TikTok */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.3s;
  }
  #load-tiktok-btn:hover {
    background-color: #e12246;
  }

  /* Крутилка (Loader) */
  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #fe2c55;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 20px 0;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Плавное появление виджета */
  .fade-in {
    animation: fadeIn 0.5s ease-in-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<!-- Скрипт динамической загрузки -->
<script>
function loadTikTokWidget() {
  const button = document.getElementById('load-tiktok-btn');
  const loader = document.getElementById('tiktok-loader');
  const container = document.getElementById('tiktok-container');

  // 1. Скрываем кнопку и показываем анимацию загрузки
  button.style.display = 'none';
  loader.style.display = 'block';

  // 2. Создаем и подключаем скрипт TikTok динамически
  const script = document.createElement('script');
  script.src = "https://tiktok.com";
  script.async = true;

  // 3. Когда скрипт TikTok полностью загрузится и создаст виджет
  script.onload = function() {
    // Небольшая задержка, чтобы виджет успел отрисоваться внутри iframe
    setTimeout(() => {
      loader.style.display = 'none'; // Прячем анимацию
      container.style.display = 'block'; // Показываем контейнер
      container.classList.add('fade-in'); // Добавляем анимацию появления
    }, 800); 
  };

  // Добавляем скрипт на страницу для запуска
  document.body.appendChild(script);
}
</script>
