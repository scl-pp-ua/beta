<link rel="stylesheet" href="https://scl.pp.ua/beta/7/1.css" />
<div class="tiktok-box">
    <button id="loadTikTokBtn" class="tiktok-btn">
        Показать TikTok
    </button>

    <div id="tiktokLoader" class="tiktok-loader" style="display: none;">
        <div class="spinner"></div>
        <span>Загрузка TikTok...</span>
    </div>

    <div id="tiktokWidget" class="tiktok-widget"></div>
</div>

<style>
.tiktok-box {
    width: 330px;
    max-width: 100%;
    margin: 0 auto;
    text-align: center;
}

.tiktok-btn {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

.tiktok-loader {
    width: 330px;
    max-width: 100%;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
}

.spinner {
    width: 34px;
    height: 34px;
    border: 4px solid #ddd;
    border-top: 4px solid #111;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.tiktok-widget {
    width: 330px;
    max-width: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.tiktok-widget.show {
    opacity: 1;
}

.tiktok-widget .tiktok-embed {
    max-width: 330px !important;
    min-width: 288px !important;
}
</style>

<script>
let tiktokLoaded = false;

document.getElementById("loadTikTokBtn").addEventListener("click", function () {
    if (tiktokLoaded) return;
    tiktokLoaded = true;

    const button = document.getElementById("loadTikTokBtn");
    const loader = document.getElementById("tiktokLoader");
    const widget = document.getElementById("tiktokWidget");

    button.style.display = "none";
    loader.style.display = "flex";

    widget.innerHTML = `
        <blockquote
            class="tiktok-embed"
            cite="https://www.tiktok.com/@scl.pp.ua"
            data-unique-id="scl.pp.ua"
            data-embed-type="creator"
            style="max-width: 330px; min-width: 288px;"
        >
            <section>
                <a target="_blank" href="https://www.tiktok.com/@scl.pp.ua?refer=creator_embed">
                    @scl.pp.ua
                </a>
            </section>
        </blockquote>
    `;

    const script = document.createElement("script");
    script.src = "https://www.tiktok.com/embed.js";
    script.async = true;

    script.onload = function () {
        setTimeout(function () {
            loader.style.display = "none";
            widget.classList.add("show");
        }, 800);
    };

    document.body.appendChild(script);
});
</script>
